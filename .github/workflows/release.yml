name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build app
        env:
          GITHUB_ACTIONS: 'true'
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run build

      - name: Prepare release metadata
        id: release_meta
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "release_tag=main-release-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "asset_name=beanPixel-main-$short_sha.zip" >> "$GITHUB_OUTPUT"

      - name: Archive build artifacts
        run: zip -r "${{ steps.release_meta.outputs.asset_name }}" dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.release_tag }}
          name: Main release for ${{ steps.release_meta.outputs.short_sha }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: ${{ steps.release_meta.outputs.asset_name }}
          generate_release_notes: true
