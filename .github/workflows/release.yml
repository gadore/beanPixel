name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build app
        env:
          GITHUB_ACTIONS: 'true'
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run build

      - name: Archive build artifacts
        run: zip -r beanPixel-main-${{ github.sha }}.zip dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main-release-${{ github.sha }}
          name: Main release for ${{ github.sha }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: beanPixel-main-${{ github.sha }}.zip
          generate_release_notes: true
